[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-eva"
version = "0.1.0"
description = "A lightweight after-close A-share research workspace."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "baostock>=0.9.3,<1",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pydantic-settings>=2.6,<3",
  "pytz>=2025.2",
  "ta-lib==0.7.0",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
supplemental = [
  "akshare==1.18.78",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
